<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>备件仓库管理系统 v3.0.5</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 网页版专属：登录遮罩 + 网页版角标（不影响 exe 的 style.css） */
    .desk-login { position: fixed; inset: 0; z-index: 99999; background: #f1f5f9;
      display: flex; align-items: center; justify-content: center; }
    .desk-login[hidden] { display: none; }
    .desk-login-card { width: 360px; max-width: 92vw; background: #fff; border-radius: 14px;
      box-shadow: 0 12px 40px rgba(15,23,42,.18); padding: 32px 28px; text-align: center; }
    .desk-login-logo { font-size: 40px; }
    .desk-login-card h2 { margin: 10px 0 4px; font-size: 19px; color: #0f172a; }
    .desk-login-sub { margin: 0 0 8px; color: #64748b; font-size: 13px; }
    .desk-login-card .btn { display: flex; justify-content: center; }
    .desk-web-badge { position: fixed; top: 8px; right: 12px; z-index: 50;
      background: #0ea5e9; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px;
      opacity: .85; pointer-events: none; }
    /* 网页版：适配常见桌面分辨率（窄屏时侧栏收窄、内容不溢出） */
    @media (max-width: 1100px) {
      .sidebar { width: 180px; }
      .content { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="desk-web-badge">网页版</div>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">📦</span>
        <span class="brand-name">备件仓库管理 v3.0.5</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">🏠 仪表盘</button>
        <button class="nav-item" data-view="parts">📋 备品管理</button>
        <button class="nav-item" data-view="inbound">⬇️ 入库管理</button>
        <button class="nav-item" data-view="outbound">⬆️ 出库管理</button>
        <button class="nav-item" data-view="query">🔎 备件查询</button>
        <button class="nav-item" data-view="location">🗺️ 库位管理</button>
        <button class="nav-item" data-view="records">🔍 记录查询</button>
        <button class="nav-item" data-view="data">💾 数据备份</button>
        <button class="nav-item" data-view="settings">⚙️ 系统设置</button>
      </nav>
      <div class="sidebar-foot">
        <small class="foot-version">本地存储 · 无需联网</small>
        <small class="foot-sign">design by Frank, 2026.7.27</small>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">仪表盘</h1>
        <div class="topbar-right">
          <span id="topStats" class="top-stats"></span>
        </div>
      </header>
      <section id="content" class="content"><!-- 动态渲染 --></section>
    </main>
  </div>

  <!-- 关于 / About（主页右下角） -->
  <button id="aboutBtn" class="about-btn" onclick="openAbout()">关于 / About</button>

  <!-- 通用模态框 -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">标题</h3>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 打印专用区域（屏幕隐藏，打印时显示） -->
  <div id="printArea" class="print-area"></div>

  <!-- 浏览器 api 兼容层：必须在 db.js 之前加载，db.js 才能探测到 window.api 走服务端后端 -->
  <script>window.__SPMS_VERSION__ = '3.0.5';</script>
  <script src="js/desktop-api.js"></script>

  <!-- 离线二维码库（已本地内置，无需联网） -->
  <script src="js/vendor/qrcode-generator.js"></script>
  <script src="js/vendor/jsQR.js"></script>
  <!-- 拼音模糊匹配（本地内置，用于经办人/领用人输入联想） -->
  <script src="js/pinyin-match.js"></script>
  <!-- 扫码解析 / 编号归一化共享模块（桌面与移动端 API 共用同一份规则） -->
  <script src="js/scan-core.js"></script>
  <script src="js/staff-core.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
