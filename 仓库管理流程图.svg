<text x="460" y="112" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="460" dy="0">标签制作与粘贴</tspan><tspan x="460" dy="18">备品管理 → 批量打印标签</tspan></text>
<text x="460" y="202" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="460" dy="0">选择作业环节</tspan><tspan x="460" dy="18">入库 / 出库 / 盘点</tspan></text>
