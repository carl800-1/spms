<text x="165" y="411" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="165" dy="0">填写 数量/经办人/供应商</tspan></text>
<text x="460" y="411" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="460" dy="0">填写 数量/经办人/领用人</tspan></text>
<text x="755" y="411" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="755" dy="0">录入实盘数量</tspan></text>
<text x="165" y="503" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="165" dy="0">提交 → 库存自动 +</tspan></text>
<text x="460" y="494" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="460" dy="0">提交 → 库存自动 −</tspan><tspan x="460" dy="18">（不足则拦截）</tspan></text>
<text x="755" y="503" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="755" dy="0">显示差异 = 实盘 − 系统</tspan></text>
<text x="755" y="586" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="755" dy="0">确认 → 校正库存</tspan><tspan x="755" dy="18">+ 盘点记录</tspan></text>
<text x="460" y="687" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="460" dy="0">记录查询 / 导出 CSV</tspan></text>
<text x="460" y="782" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="460" dy="0">数据可追溯 · 定期备份</tspan></text>
<text x="460" y="888" text-anchor="middle" font-size="14" fill="#1e293b"><tspan x="460" dy="0">结束</tspan></text>
